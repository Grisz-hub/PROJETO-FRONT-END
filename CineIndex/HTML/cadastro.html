<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | CineIndex</title>
    <script src="../JS/button.js" defer></script>
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <style>
        body {
            background: url('../IMG/imagemfundo.jpeg') no-repeat center center fixed;
            background-size: cover;
        }
    </style>
    <div class="moldura">
        <div class="cadastro-card">
            <img src="../IMG/logocineindex.png" alt="Logo CineIndex" width="200" class="logo-cadastro">
            <h2 class="titulo-cadastro">Cadastro</h2>

            <form id="form-cadastro">
                <div class="input-box">
                    <span class="icon" aria-hidden="true"></span>
                    <input type="text" name="nome" placeholder="Nome completo" autocomplete="name" required>

                </div>
                <div class="input-box">
                    <span class="icon" aria-hidden="true"></span>
                    <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>

                </div>
                <div class="input-box">
                    <span class="icon" aria-hidden="true"></span>
                    <input type="password" name="senha" placeholder="Senha" autocomplete="new-password" minlength="6"
                        required>

                </div>
                <div class="options">
                    <label>
                        <input type="checkbox"> Lembrar-me
                    </label>
                </div>
                <div class="link">
                    <button type="submit" class="btn">Cadastrar</button>

                    <p class="">Já tem uma conta? <a href="login.html">Entrar</a></p>
                </div>
            </form>

        </div>

    </div>
</body>

</html>
